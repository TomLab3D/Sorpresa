<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vetrina</title>
<style id="baseStyle">
  :root {
    --paper: #f7f6f3; --ink: #141414; --ink-soft: rgba(20,20,20,0.66); --card: #ffffff; --line: rgba(20,20,20,0.13);
    --accent: #a9812f; --accent-bright: #d8b56a; --hero: #111111; --hero-ink: #f7f2e8;
    --font: "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  body { background: var(--paper); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased; min-height: 100dvh; }
  .app { max-width: 640px; margin: 0 auto; padding: 0 1.2rem max(2rem, env(safe-area-inset-bottom)); }

  .hero {
    background: var(--hero); color: var(--hero-ink); position: relative; overflow: hidden;
    margin: 0 -1.2rem; padding: max(1.4rem, min(env(safe-area-inset-top), 2rem)) 1.4rem 1.7rem;
    border-radius: 0 0 28px 28px;
  }
  .hero > * { position: relative; z-index: 1; }
  .hero.hero-photo { background-size: cover; background-position: center; }
  .hero.hero-photo::before {
    content: ""; position: absolute; inset: 0; z-index: 0;
    background: linear-gradient(180deg, color-mix(in srgb, var(--hero) 30%, transparent) 0%, rgba(10,10,10,0.7) 100%);
  }
  .logo { font-weight: 800; font-size: clamp(2.5rem, 12.5vw, 3.7rem); line-height: 0.92; letter-spacing: -0.035em; }
  .logo span { color: var(--accent-bright); }
  .logo-img { display: block; max-height: 4.2rem; max-width: 78%; object-fit: contain; object-position: left center; }
  .logo-bar { width: 3.4rem; height: 3px; margin-top: 1rem; background: var(--accent-bright); }
  .tagline { margin-top: 0.9rem; font-size: 1rem; line-height: 1.45; color: color-mix(in srgb, var(--hero-ink) 78%, transparent); font-weight: 500; max-width: 36ch; }
  .chips { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 1rem; }
  .chips span { font-size: 0.8rem; font-weight: 600; padding: 0.4rem 0.8rem; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--accent-bright) 60%, transparent); color: var(--hero-ink); }

  .tiles { display: grid; gap: 0.8rem; margin-top: 1.4rem; }
  .tile {
    appearance: none; cursor: pointer; font: inherit; color: inherit; text-align: left;
    display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 1rem;
    padding: 1.1rem 1.15rem; border-radius: 20px; background: var(--card); border: 1.5px solid var(--line);
    -webkit-tap-highlight-color: transparent; transition: transform 0.15s ease, border-color 0.2s ease;
  }
  .tile:active { transform: scale(0.98); }
  .tile:hover { border-color: var(--ink); }
  .tile .ic { width: 3.2rem; height: 3.2rem; border-radius: 14px; background: var(--hero); color: var(--accent-bright); display: grid; place-items: center; font-size: 1.5rem; }
  .tile h2 { font-size: 1.45rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; }
  .tile p { margin-top: 0.25rem; font-size: 0.92rem; color: var(--ink-soft); font-weight: 500; line-height: 1.3; }
  .tile .arr { width: 1.4rem; height: 1.4rem; color: var(--accent); }

  .lead { margin-top: 1.2rem; padding: 1.1rem 1.15rem; border-radius: 20px; background: var(--hero); color: var(--hero-ink); }
  .lead b { display: block; font-size: 1.15rem; font-weight: 800; letter-spacing: -0.01em; }
  .lead p { margin-top: 0.3rem; font-size: 0.92rem; line-height: 1.4; color: color-mix(in srgb, var(--hero-ink) 76%, transparent); }
  .lead .btn { margin-top: 0.8rem; background: var(--accent-bright); border-color: var(--accent-bright); color: var(--hero); }

  .back {
    appearance: none; cursor: pointer; font: inherit; font-weight: 700; font-size: 0.95rem; color: var(--ink);
    background: transparent; border: 1.5px solid var(--ink); border-radius: 999px; padding: 0.5rem 1rem; margin-top: 1.2rem;
    display: inline-flex; align-items: center; gap: 0.4rem; -webkit-tap-highlight-color: transparent;
  }
  .back svg { width: 0.9rem; height: 0.9rem; }
  .cat-title { margin-top: 1.1rem; font-size: clamp(2rem, 10vw, 3rem); font-weight: 700; letter-spacing: -0.03em; line-height: 1; }
  .cat-title::after { content: ""; display: block; width: 2.6rem; height: 3px; margin-top: 0.7rem; background: var(--accent); }
  .cat-sub { margin-top: 0.7rem; color: var(--ink-soft); font-weight: 500; font-size: 1rem; }
  .group { margin-top: 1.5rem; }
  .group h3 { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 0.55rem; }
  .links { display: grid; gap: 0.5rem; }
  .link {
    display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 0.8rem; text-decoration: none; color: var(--ink);
    padding: 0.9rem 1.1rem; border-radius: 16px; background: var(--card); border: 1.5px solid var(--line);
    -webkit-tap-highlight-color: transparent; transition: transform 0.15s ease, border-color 0.2s ease;
  }
  .link:active { transform: scale(0.98); }
  .link:hover { border-color: var(--ink); }
  .link b { display: block; font-size: 1.05rem; font-weight: 700; letter-spacing: -0.01em; }
  .link small { display: block; margin-top: 0.15rem; font-size: 0.83rem; font-weight: 500; color: var(--ink-soft); }
  .link svg { width: 1.15rem; height: 1.15rem; color: var(--accent); }
  .link.first { background: var(--hero); color: var(--hero-ink); border-color: var(--hero); }
  .link.first small { color: color-mix(in srgb, var(--hero-ink) 72%, transparent); }
  .link.first svg { color: var(--accent-bright); }

  .form { margin-top: 1.3rem; display: grid; gap: 0.9rem; }
  .form label { display: grid; gap: 0.35rem; font-size: 0.9rem; font-weight: 700; }
  .form input {
    font: inherit; font-size: 1.05rem; font-weight: 500; color: var(--ink); background: var(--card);
    border: 1.5px solid var(--line); border-radius: 14px; padding: 0.85rem 0.95rem; width: 100%; -webkit-appearance: none; appearance: none;
  }
  .form input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }
  .form input.bad { border-color: #c0392b; }
  .form fieldset { border: 0; display: grid; gap: 0.45rem; }
  .form legend { font-size: 0.9rem; font-weight: 700; margin-bottom: 0.1rem; }
  .pick { display: flex; flex-wrap: wrap; gap: 0.45rem; }
  .pick button {
    appearance: none; cursor: pointer; font: inherit; font-weight: 700; font-size: 0.92rem; color: var(--ink); background: transparent;
    border: 1.5px solid var(--line); border-radius: 999px; padding: 0.5rem 0.95rem; -webkit-tap-highlight-color: transparent;
  }
  .pick button[aria-pressed="true"] { background: var(--hero); border-color: var(--hero); color: var(--accent-bright); }
  .err { color: #c0392b; font-weight: 700; font-size: 0.92rem; }
  .ok { font-weight: 700; font-size: 0.95rem; padding: 0.8rem 1rem; border-radius: 14px; background: color-mix(in srgb, var(--accent) 16%, transparent); }
  .note { font-size: 0.8rem; color: var(--ink-soft); line-height: 1.4; }

  .site { margin-top: 1.5rem; display: flex; }
  .btn {
    appearance: none; cursor: pointer; font: inherit; font-weight: 800; font-size: 1.02rem; text-decoration: none; text-align: center;
    display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; width: 100%;
    padding: 0.95rem 1.4rem; border-radius: 999px; border: 2px solid var(--ink); background: var(--ink); color: var(--paper);
    -webkit-tap-highlight-color: transparent; transition: transform 0.15s ease;
  }
  .btn:active { transform: scale(0.97); }
  .btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  .btn.ghost:hover { border-color: var(--ink); }

  .contacts { margin-top: 2rem; padding-top: 1.2rem; border-top: 1px solid var(--line); }
  .contacts h3 { font-size: 0.82rem; font-weight: 800; color: var(--ink-soft); margin-bottom: 0.7rem; letter-spacing: 0.02em; }
  .crow { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.5rem; }
  .crow .btn { padding: 0.75rem 0.6rem; font-size: 0.95rem; }
  .info { margin-top: 1rem; font-size: 0.9rem; line-height: 1.5; color: var(--ink-soft); font-weight: 500; }
  button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }



  /* =======================================================================
     Dentro lo stile "Minimale": alcuni tratti restano modificabili
     (attaccata/staccata, angoli, ombra, icone, etichette), sia nel
     Minimale "originale" sia in quello che prima era "Naturale".
     ======================================================================= */
  [data-hero-staccata] .hero { margin: 0.6rem -1.2rem 0; border-radius: 28px; }
  [data-radius-soft] .tile, [data-radius-soft] .link, [data-radius-soft] .lead { border-radius: 28px; }
  [data-shadow-soft] .tile, [data-shadow-soft] .link { border: 0; box-shadow: 0 8px 20px rgba(0,0,0,0.06); }
  [data-shadow-soft] .lead { border: 0; box-shadow: 0 10px 24px rgba(0,0,0,0.08); }
  [data-icons-circle] .tile .ic { border-radius: 999px; background: color-mix(in srgb, var(--accent) 16%, var(--card)); color: var(--accent); }
  [data-chips-filled] .chips span { border: 0; background: color-mix(in srgb, var(--accent-bright) 22%, transparent); }

  /* =======================================================================
     STILE "editoriale": niente riquadri pieni, righe sottili, maiuscoletto.
     ======================================================================= */
  [data-style="editoriale"] .hero {
    background: transparent; color: var(--ink); border-radius: 0;
    padding-left: 0; padding-right: 0; border-bottom: 2px solid var(--ink);
  }
  [data-style="editoriale"] .tagline, [data-style="editoriale"] .chips span { color: var(--ink-soft); }
  [data-style="editoriale"] .chips span { border-radius: 0; border: 0; border-bottom: 1.5px solid var(--accent); padding: 0.2rem 0; text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.72rem; }
  [data-style="editoriale"] .logo-bar { display: none; }
  [data-style="editoriale"] .logo, [data-style="editoriale"] .logo-img { }
  [data-style="editoriale"] .tiles { gap: 0; }
  [data-style="editoriale"] .tile {
    border: 0; border-top: 1px solid var(--line); border-radius: 0; background: transparent; padding: 1.3rem 0.1rem;
  }
  [data-style="editoriale"] .tiles .tile:last-child { border-bottom: 1px solid var(--line); }
  [data-style="editoriale"] .tiles { counter-reset: catnum; }
  [data-style="editoriale"] .tile { counter-increment: catnum; grid-template-columns: 1fr auto; align-items: baseline; }
  [data-style="editoriale"] .tile .ic { display: none; }
  [data-style="editoriale"] .tile h2 { font-weight: 800; font-size: 1.7rem; letter-spacing: -0.01em; }
  [data-style="editoriale"] .tile h2::before { content: counter(catnum, decimal-leading-zero) "\2003"; color: var(--accent); font-size: 1rem; font-weight: 800; vertical-align: middle; }
  [data-style="editoriale"] .tile p { text-transform: uppercase; letter-spacing: 0.06em; font-size: 0.72rem; }
  [data-style="editoriale"] .tile .arr { color: var(--accent); width: 1.1rem; height: 1.1rem; }
  [data-style="editoriale"] .logo { font-size: clamp(3rem, 15vw, 4.6rem); }
  [data-style="editoriale"] .tagline { font-size: 1.1rem; max-width: 30ch; }
  [data-style="editoriale"] .lead { border-radius: 0; background: transparent; color: var(--ink); border-top: 2px solid var(--ink); border-bottom: 2px solid var(--ink); padding: 1.3rem 0; }
  [data-style="editoriale"] .lead p { color: var(--ink-soft); }
  [data-style="editoriale"] .lead .btn { background: var(--ink); border-color: var(--ink); color: var(--paper); border-radius: 0; }
  [data-style="editoriale"] .cat-title { text-transform: uppercase; letter-spacing: 0.02em; }
  [data-style="editoriale"] .cat-title::after { display: none; }
  [data-style="editoriale"] .group h3 { text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.85rem; font-weight: 800; }
  [data-style="editoriale"] .link { border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: transparent; padding: 1rem 0.1rem; }
  [data-style="editoriale"] .link.first { background: transparent; color: var(--ink); border-bottom: 2px solid var(--accent); }
  [data-style="editoriale"] .link.first small { color: var(--ink-soft); }
  [data-style="editoriale"] .link.first svg { color: var(--accent); }
  [data-style="editoriale"] .back { border-radius: 0; }
  [data-style="editoriale"] .btn { border-radius: 0; }
  [data-style="editoriale"] .tile:active, [data-style="editoriale"] .link:active { transform: none; opacity: 0.6; }

  /* =======================================================================
     STILE "elegante": centrato, righe sottili dorate, molto respiro.
     ======================================================================= */
  [data-style="elegante"] .hero {
    background: transparent; color: var(--ink); border-radius: 0; text-align: center;
    padding-left: 0.4rem; padding-right: 0.4rem; padding-bottom: 1.1rem;
  }
  [data-style="elegante"] .logo { font-weight: 500; letter-spacing: 0.02em; }
  [data-style="elegante"] .logo span { color: var(--accent); }
  [data-style="elegante"] .logo-img { margin: 0 auto; }
  [data-style="elegante"] .logo-bar { margin-left: auto; margin-right: auto; background: var(--accent); width: 2.2rem; }
  [data-style="elegante"] .tagline { margin-left: auto; margin-right: auto; color: var(--ink-soft); }
  [data-style="elegante"] .chips { justify-content: center; }
  [data-style="elegante"] .chips span { border-radius: 0; border: 0; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.1em; font-size: 0.68rem; padding: 0; }
  [data-style="elegante"] .chips span:not(:last-child)::after { content: "·"; margin-left: 0.6rem; color: var(--accent); }
  [data-style="elegante"] .tile {
    border: 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); border-radius: 0; background: transparent;
    display: flex; flex-direction: column; align-items: center; text-align: center; gap: 0.4rem; padding: 1.6rem 0.5rem;
  }
  [data-style="elegante"] .tiles { gap: 0; margin-top: 2rem; }
  [data-style="elegante"] .tiles .tile + .tile { border-top: 0; }
  [data-style="elegante"] .tile .ic { background: transparent; border: 0; color: var(--accent); font-size: 0.6rem; width: auto; height: auto; }
  [data-style="elegante"] .tile h2 { font-weight: 500; font-size: 1.5rem; letter-spacing: 0.01em; }
  [data-style="elegante"] .tile p { color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.1em; font-size: 0.68rem; margin-top: 0.3rem; }
  [data-style="elegante"] .logo { font-size: clamp(2.2rem, 9vw, 2.8rem); text-transform: uppercase; letter-spacing: 0.14em; font-weight: 400; }
  [data-style="elegante"] .tagline { font-style: italic; font-size: 0.98rem; }
  [data-style="elegante"] .tile .arr { display: none; }
  [data-style="elegante"] .lead { text-align: center; border-radius: 0; background: transparent; color: var(--ink); border-top: 1px solid var(--accent); border-bottom: 1px solid var(--accent); padding: 1.6rem 0.5rem; }
  [data-style="elegante"] .lead p { color: var(--ink-soft); }
  [data-style="elegante"] .lead .btn { background: transparent; color: var(--ink); border: 1px solid var(--ink); border-radius: 999px; max-width: 16rem; margin: 0.9rem auto 0; }
  [data-style="elegante"] .cat-title { text-align: center; font-weight: 500; }
  [data-style="elegante"] .cat-title::after { margin-left: auto; margin-right: auto; background: var(--accent); }
  [data-style="elegante"] .cat-sub { text-align: center; }
  [data-style="elegante"] .group h3 { text-align: center; text-transform: uppercase; letter-spacing: 0.12em; font-size: 0.78rem; font-weight: 700; color: var(--ink-soft); }
  [data-style="elegante"] .link { border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: transparent; text-align: center; grid-template-columns: 1fr; padding: 1rem 0.5rem; }
  [data-style="elegante"] .link svg { display: none; }
  [data-style="elegante"] .link.first { background: transparent; color: var(--ink); border-bottom: 1px solid var(--accent); }
  [data-style="elegante"] .back { border-radius: 999px; margin-left: auto; margin-right: auto; display: flex; width: fit-content; }
  [data-style="elegante"] .contacts { text-align: center; }
  [data-style="elegante"] .crow { max-width: 24rem; margin: 0 auto; }



  /* =======================================================================
     STILE "audace": blocchi pieni, bordi spessi, ombra netta, poster.
     ======================================================================= */
  [data-style="audace"] { }
  [data-style="audace"] .hero { border-radius: 0; border: 3px solid var(--ink); margin: 0.6rem -0.6rem 0; box-shadow: 7px 7px 0 var(--ink); }
  [data-style="audace"] .logo { text-transform: uppercase; font-weight: 800; letter-spacing: -0.02em; }
  [data-style="audace"] .logo-bar { height: 5px; background: var(--accent-bright); }
  [data-style="audace"] .chips span { border-radius: 0; border: 2px solid var(--accent-bright); font-weight: 800; text-transform: uppercase; }
  [data-style="audace"] .tiles { gap: 1rem; }
  [data-style="audace"] .tile {
    border: 3px solid var(--ink); border-radius: 0; background: var(--card); box-shadow: 6px 6px 0 var(--ink);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  [data-style="audace"] .tile:active { transform: translate(4px, 4px); box-shadow: 2px 2px 0 var(--ink); }
  [data-style="audace"] .tile .ic { border-radius: 0; border: 2px solid var(--ink); background: var(--accent-bright); color: var(--ink); }
  [data-style="audace"] .tile h2 { text-transform: uppercase; font-weight: 800; }
  [data-style="audace"] .tile .arr { color: var(--ink); }
  [data-style="audace"] .lead { border-radius: 0; border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); }
  [data-style="audace"] .lead .btn { border-radius: 0; border: 2px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); }
  [data-style="audace"] .cat-title { text-transform: uppercase; font-weight: 800; }
  [data-style="audace"] .cat-title::after { height: 5px; background: var(--accent); }
  [data-style="audace"] .group h3 { text-transform: uppercase; font-weight: 800; }
  [data-style="audace"] .link { border: 2.5px solid var(--ink); border-radius: 0; box-shadow: 4px 4px 0 var(--ink); }

  [data-style="audace"] .link.first { background: var(--accent-bright); color: var(--ink); border-color: var(--ink); }
  [data-style="audace"] .link.first svg { color: var(--ink); }
  [data-style="audace"] .btn { border-radius: 0; border-width: 2.5px; }
  [data-style="audace"] .back { border-radius: 0; border-width: 2.5px; }

  /* =======================================================================

  [data-style="audace"] { }
  [data-style="audace"] .hero { border-radius: 0; border: 3px solid var(--ink); margin: 0.6rem -0.6rem 0; box-shadow: 7px 7px 0 var(--ink); }
  [data-style="audace"] .logo { text-transform: uppercase; font-weight: 800; letter-spacing: -0.02em; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="hero">
    <div class="logo" id="logo" hidden></div>
    <img class="logo-img" id="logoImg" hidden alt="">
    <div class="logo-bar"></div>
    <p class="tagline" id="tagline"></p>
    <div class="chips" id="chips"></div>
  </header>

  <main id="home">
    <div class="tiles" id="tiles" aria-label="Categorie"></div>
    <section class="lead" id="lead" hidden>
      <b id="leadTitle"></b>
      <p id="leadText"></p>
      <a class="btn" id="leadBtn" href="#lead-form">-</a>
    </section>
  </main>

  <main id="cat" hidden>
